services:
  backend:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./backend/db:/app/backend/db
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: ["sh", "-c", "npm install && npm run dev -- --host"]
    ports:
      - "5173:5173"
    depends_on:
      - backend
