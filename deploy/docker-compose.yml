services:
  proxy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ui
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      AEP_DATA_ROOT: /var/aep/data
      AEP_VERSION: "0.6.0"
      AEP_BOOTSTRAP_ADMIN_USERNAME: ${AEP_BOOTSTRAP_ADMIN_USERNAME:-admin}
      AEP_BOOTSTRAP_ADMIN_PASSWORD: ${AEP_BOOTSTRAP_ADMIN_PASSWORD:-changeme}
      AEP_BOOTSTRAP_ADMIN_DISPLAY: ${AEP_BOOTSTRAP_ADMIN_DISPLAY:-AEP Administrator}
    volumes:
      - aep_data:/var/aep/data
    expose:
      - "8080"

volumes:
  aep_data:
  caddy_data:
  caddy_config:
